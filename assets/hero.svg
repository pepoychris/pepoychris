<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Christian Ortiz Belmonte - Backend Software Engineer</title>
  <desc id="desc">A mission-control inspired profile banner showing a resilient backend system with animated data packets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1e2e"/>
      <stop offset="1" stop-color="#0c2631"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32f5c8"/>
      <stop offset="1" stop-color="#46a8ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#32f5c8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#32f5c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7dd3fc" stroke-opacity=".055"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="1015" cy="105" r="230" fill="url(#glow)"/>
  <path d="M26 92H1174M26 348H1174" stroke="#85a7be" stroke-opacity=".16"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(54 50)">
      <circle cx="7" cy="7" r="7" fill="#32f5c8" filter="url(#softGlow)"/>
      <text x="26" y="12" fill="#87a8bd" font-size="14" font-weight="700" letter-spacing="3">PROFILE SYSTEM / ONLINE</text>
    </g>

    <text x="54" y="155" fill="#f4fbff" font-size="61" font-weight="800" letter-spacing="-2">CHRISTIAN</text>
    <text x="54" y="214" fill="url(#signal)" font-size="61" font-weight="800" letter-spacing="-2">ORTIZ BELMONTE</text>
    <text x="58" y="259" fill="#b9cad6" font-size="18" font-weight="650" letter-spacing="4">BACKEND SOFTWARE ENGINEER</text>

    <g transform="translate(56 292)" font-size="14" font-weight="650">
      <rect width="83" height="31" rx="15.5" fill="#173344" stroke="#32f5c8" stroke-opacity=".55"/>
      <text x="41.5" y="20.5" fill="#d8fff5" text-anchor="middle">JAVA</text>
      <rect x="94" width="132" height="31" rx="15.5" fill="#173344" stroke="#32f5c8" stroke-opacity=".55"/>
      <text x="160" y="20.5" fill="#d8fff5" text-anchor="middle">SPRING BOOT</text>
      <rect x="237" width="140" height="31" rx="15.5" fill="#173344" stroke="#46a8ff" stroke-opacity=".55"/>
      <text x="307" y="20.5" fill="#dcebff" text-anchor="middle">MICROSERVICES</text>
    </g>

    <text x="58" y="372" fill="#728fa3" font-size="13" font-weight="650" letter-spacing="2.4">ALICANTE, SPAIN  /  BUILDING RELIABLE PATHS FOR DATA</text>

    <g transform="translate(750 70)">
      <path d="M70 84H168V38H276M168 84V153H276M168 84H280V233H355" fill="none" stroke="#5f8197" stroke-width="2" stroke-dasharray="5 7" opacity=".62"/>
      <path id="routeA" d="M70 84H168V38H276" fill="none"/>
      <path id="routeB" d="M70 84H168V153H276" fill="none"/>
      <path id="routeC" d="M70 84H280V233H355" fill="none"/>

      <g>
        <rect x="0" y="55" width="100" height="58" rx="13" fill="#102b3a" stroke="#32f5c8" stroke-width="2"/>
        <text x="50" y="80" fill="#e2fff8" font-size="13" font-weight="750" text-anchor="middle">API</text>
        <text x="50" y="99" fill="#6f9bad" font-size="10" letter-spacing="1.5" text-anchor="middle">ENTRY</text>
      </g>
      <g>
        <rect x="246" y="10" width="118" height="56" rx="13" fill="#102b3a" stroke="#46a8ff" stroke-width="1.5"/>
        <text x="305" y="34" fill="#e8f4ff" font-size="12" font-weight="750" text-anchor="middle">SERVICE 01</text>
        <text x="305" y="51" fill="#6f9bad" font-size="9" letter-spacing="1.3" text-anchor="middle">BUSINESS LOGIC</text>
      </g>
      <g>
        <rect x="246" y="125" width="118" height="56" rx="13" fill="#102b3a" stroke="#46a8ff" stroke-width="1.5"/>
        <text x="305" y="149" fill="#e8f4ff" font-size="12" font-weight="750" text-anchor="middle">SERVICE 02</text>
        <text x="305" y="166" fill="#6f9bad" font-size="9" letter-spacing="1.3" text-anchor="middle">TESTED PATH</text>
      </g>
      <g>
        <path d="M337 209h36l18 24-18 24h-36l-18-24z" fill="#102b3a" stroke="#32f5c8" stroke-width="1.5"/>
        <text x="355" y="230" fill="#e2fff8" font-size="11" font-weight="750" text-anchor="middle">DATA</text>
        <text x="355" y="245" fill="#6f9bad" font-size="8" letter-spacing="1" text-anchor="middle">SAFE</text>
      </g>

      <g fill="#32f5c8" filter="url(#softGlow)">
        <circle r="4"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#routeA"/></animateMotion></circle>
        <circle r="4"><animateMotion dur="4.1s" begin="-1.8s" repeatCount="indefinite"><mpath href="#routeB"/></animateMotion></circle>
        <circle r="4"><animateMotion dur="5s" begin="-3s" repeatCount="indefinite"><mpath href="#routeC"/></animateMotion></circle>
      </g>

      <g transform="translate(0 280)" font-size="10" font-weight="700" letter-spacing="1.5">
        <circle cx="5" cy="-3" r="4" fill="#32f5c8"/>
        <text x="18" y="1" fill="#88a9bb">CONTRACTS VERIFIED</text>
        <circle cx="173" cy="-3" r="4" fill="#46a8ff"/>
        <text x="186" y="1" fill="#88a9bb">PIPELINE GREEN</text>
      </g>
    </g>
  </g>
</svg>

