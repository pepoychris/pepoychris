    <path d="M600 195L315 112M600 195L885 112M600 195L315 282M600 195L885 282" stroke="#52758b" stroke-width="1.5" stroke-dasharray="5 7" opacity=".55"/>
    <circle cx="600" cy="195" r="34" fill="#102b3a" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="600" cy="195" r="5" fill="#32f5c8" filter="url(#glow)"/>
    <text x="600" y="250" text-anchor="middle" fill="#688da2" font-size="9" font-weight="700" letter-spacing="1.7">BUILD / TEST / LEARN</text>


    <g transform="translate(42 61)">
