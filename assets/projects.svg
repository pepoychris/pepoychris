<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Christian's project constellation</title>
  <desc id="desc">Four selected projects: GeoWarden, Gozadera, Coobi Logistics and RoboRoute Nexus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/><stop offset="1" stop-color="#0c2631"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#32f5c8"/><stop offset="1" stop-color="#46a8ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ec9e8" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="22" fill="url(#grid)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
