      <circle cx="30" cy="30" r="8" fill="#32f5c8" filter="url(#glow)"/>
      <text x="50" y="36" fill="#f2fbff" font-size="21" font-weight="800">GEOWARDEN</text>
      <text x="466" y="34" text-anchor="end" fill="#32f5c8" font-size="11" font-weight="800">&lt;2s</text>
      <text x="28" y="68" fill="#97afbd" font-size="13">Satellite imagery → structural damage assessment</text>
      <g transform="translate(28 84)" fill="#cbe9f6" font-size="10" font-weight="700">
        <rect width="65" height="23" rx="11.5" fill="#173747"/><text x="32.5" y="15.5" text-anchor="middle">PYTHON</text>
        <rect x="74" width="75" height="23" rx="11.5" fill="#173747"/><text x="111.5" y="15.5" text-anchor="middle">PYTORCH</text>
        <rect x="158" width="119" height="23" rx="11.5" fill="#173747"/><text x="217.5" y="15.5" text-anchor="middle">COMPUTER VISION</text>
