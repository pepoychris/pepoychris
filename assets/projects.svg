        <rect x="63" width="73" height="23" rx="11.5" fill="#173747"/><text x="99.5" y="15.5" text-anchor="middle">STREAMS</text>
        <rect x="145" width="82" height="23" rx="11.5" fill="#173747"/><text x="186" y="15.5" text-anchor="middle">POSTGRES</text>
