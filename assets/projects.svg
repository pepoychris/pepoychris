      <rect width="505" height="123" rx="16" fill="#0f2534" stroke="#32f5c8" stroke-opacity=".62"/>
      <circle cx="30" cy="30" r="8" fill="#32f5c8" filter="url(#glow)"/>
      <text x="50" y="36" fill="#f2fbff" font-size="21" font-weight="800">ROBOROUTE NEXUS</text>
      <text x="466" y="34" text-anchor="end" fill="#32f5c8" font-size="11" font-weight="800">LOCAL AI</text>
